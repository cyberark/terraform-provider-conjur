# Create a policy for the host
- !policy
  id: terraform
  owner: !host /data/testapp
  annotations:
    description: Policy for terraform
  body:
  - &variables
    - !variable target-password
  
  - !group consumers

  - !permit
    role: !group consumers
    privilege: [ read, execute ]
    resource: *variables

  # AWS credentials referenced by the conjur_issuer tests. The Issuers API validates the format
  # of the values it reads from these, so they hold the AWS documentation example keys. The "-2"
  # pair lets the update stage rotate the issuer onto different references.
  - !variable aws-access-key-id
  - !variable aws-secret-access-key
  - !variable aws-access-key-id-2
  - !variable aws-secret-access-key-2

  # Child policy for the testapp user to manipulate
  - !policy 
    id: test
    body: 
    - !host test-workload
    - !host another-test-workload
    - !variable workload-secret

  - !permit 
    role: !host /data/testapp
    privileges: [ read, update, create, delete ]
    resource: !policy test
