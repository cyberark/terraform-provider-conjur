            $ref: '#/components/schemas/Error'
          examples:
            ForbiddenError:
              $ref: '#/components/examples/Forbidden'
    TrustDomainConflict:
      description: >
        A trust domain with this name already exists, or the trust domain cannot be deleted because it is
