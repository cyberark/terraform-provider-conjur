openapi: 3.0.3
info:
  title: SWA Service API
  description: >
    Documents the REST APIs for Secure Workload Access (SWA). Use these APIs to manage trust domains,
    server groups, node groups, register servers, and retrieve OIDC discovery and federation endpoints.
  version: 1.0.0
  contact:
    name: SWA Service Team

servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/CyberArk/swa-services-api/main
  - url: /
    x-internal: false


security:
  # kics-scan ignore-line
  - ConjurAccessToken: []

paths:
  /api/swa/livez:
    get:
      summary: Liveness probe
      description: Verifies SWA is running. You do not need to authenticate.
      x-internal: true
      operationId: get-livez
      tags:
        - Health
      # kics-scan ignore-line
      security: []  # No auth required - health check endpoint
      responses:
        '200':
          description: Service is alive
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status

  /api/swa/trust-domains:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
    get:
      summary: List SWA trust domains
      description: Lists SWA trust domains with optional pagination.
      operationId: get-trust-domains
      tags:
        - Trust Domains
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/TrustDomainListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Register SWA trust domain
      description: Registers a new SWA trust domain.
      operationId: post-trust-domain
      tags:
        - Trust Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrustDomainRequest'
      responses:
        '201':
          $ref: '#/components/responses/TrustDomainCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '409':
          $ref: '#/components/responses/TrustDomainConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
    get:
      summary: Get SWA trust domain
      description: Returns SWA trust domain details for the path `trust-domain-name`.
      operationId: get-trust-domain
      tags:
        - Trust Domains
      responses:
        '200':
          $ref: '#/components/responses/TrustDomainSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update SWA trust domain
      description: >
        Updates SWA trust domain settings.

        This operation is idempotent: you can call it multiple times with the same trust domain name, and each call succeeds.
      operationId: patch-trust-domain
      tags:
        - Trust Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrustDomainRequest'
      responses:
        '200':
          $ref: '#/components/responses/TrustDomainSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete SWA trust domain
      description: >
        Deletes the SWA trust domain and all resources inside it.
      operationId: delete-trust-domain
      tags:
        - Trust Domains
      responses:
        '204':
          description: Deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '409':
          $ref: '#/components/responses/TrustDomainConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/.well-known/ca-bundles:
    parameters:
      - $ref: '#/components/parameters/TrustDomainName'
    get:
      summary: Get SWA CA bundles
      description: Returns CA bundles for the path `trust-domain-name`.
      operationId: get-ca-bundles
      tags:
        - Trust Domains
      # kics-scan ignore-line
      security: []
      parameters:
        - name: format
          in: query
          required: false
          description: |
            Response bundle format:
            - `der` (default): returns `{ "bundles": ["<base64-der>", ...] }`.
            - `pem`: returns `{ "bundle": "-----BEGIN CERTIFICATE-----..." }`.
          schema:
            type: string
            enum: [der, pem]
            default: der
      responses:
        '200':
          description: CA bundles retrieved successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type-V2'
          content:
            application/x.secretsmgr.v2+json:
              schema:
                $ref: '#/components/schemas/CABundleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
    post:
      summary: Create SWA server group
      description: Creates an SWA server group in the path trust domain.
      operationId: post-server-group
      tags:
        - Server Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerGroupRequest'
      responses:
        '201':
          $ref: '#/components/responses/ServerGroupCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '409':
          $ref: '#/components/responses/ServerGroupConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List SWA server groups
      description: Lists SWA server groups with optional pagination.
      operationId: get-server-groups
      tags:
        - Server Groups
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ServerGroupListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TrustDomainNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups/{server-group-name}:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
      - $ref: '#/components/parameters/ServerGroupName'
    get:
      summary: Get SWA server group
      description: Returns SWA server group details for the path `server-group-name`.
      operationId: get-server-group
      tags:
        - Server Groups
      responses:
        '200':
          $ref: '#/components/responses/ServerGroupSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete SWA server group
      description: >
        Deletes the SWA server group.

        You also delete all servers in that group and their related resources in Secrets Manager.
      operationId: delete-server-group
      tags:
        - Server Groups
      responses:
        '204':
          description: Deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '409':
          $ref: '#/components/responses/ServerGroupConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update SWA server group
      description: Updates SWA server group settings for the path `server-group-name`.
      operationId: patch-server-group
      tags:
        - Server Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerGroupRequest'
      responses:
        '200':
          $ref: '#/components/responses/ServerGroupSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '409':
          $ref: '#/components/responses/ServerGroupConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups/{server-group-name}/node-groups:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
      - $ref: '#/components/parameters/ServerGroupName'
    get:
      summary: List SWA node groups
      description: >
        Lists SWA node groups with optional pagination.
        The response includes only node groups you are authorized to see.
      operationId: get-node-groups
      tags:
        - Node Groups
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/NodeGroupListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create SWA node group
      description: Creates an SWA node group.
      operationId: post-node-groups
      tags:
        - Node Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/NodeGroupCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '409':
          $ref: '#/components/responses/NodeGroupConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups/{server-group-name}/node-groups/{node-group-name}:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
      - $ref: '#/components/parameters/ServerGroupName'
      - $ref: '#/components/parameters/NodeGroupName'
    get:
      summary: Get SWA node group
      description: Returns SWA node group details for the path `node-group-name`.
      operationId: get-node-group
      tags:
        - Node Groups
      responses:
        '200':
          $ref: '#/components/responses/NodeGroupSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NodeGroupNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update SWA node group
      description: >
        Updates SWA node group settings for the path `node-group-name`.
        You can change `description` and `workload_configuration`. You cannot change the node group `name` or its parent server group after creation.
      operationId: patch-node-group
      tags:
        - Node Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/NodeGroupSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NodeGroupNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete SWA node group
      description: Deletes the SWA node group for the path `node-group-name`.
      operationId: delete-node-group
      tags:
        - Node Groups
      responses:
        '204':
          description: Deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NodeGroupNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups/{server-group-name}/components:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
      - $ref: '#/components/parameters/ServerGroupName'
    post:
      summary: Register SWA server
      description: Registers an SWA server.
      operationId: post-server
      tags:
        - Servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          $ref: '#/components/responses/ServerCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '409':
          $ref: '#/components/responses/ServerConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List SWA servers
      description: Lists SWA servers in the path server group with optional pagination.
      operationId: get-servers
      tags:
        - Servers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/ServerListSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServerGroupNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/server-groups/{server-group-name}/components/{server-name}:
    parameters:
      - $ref: '#/components/parameters/AcceptSwa'
      - $ref: '#/components/parameters/TrustDomainName'
      - $ref: '#/components/parameters/ServerGroupName'
      - $ref: '#/components/parameters/ServerName'
    get:
      summary: Get SWA server
      description: Returns SWA server details for the path `server-name`.
      operationId: get-server
      tags:
        - Servers
      responses:
        '200':
          $ref: '#/components/responses/ServerSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete SWA server
      description: Deletes the SWA server for the path `server-name`.
      operationId: delete-server
      tags:
        - Servers
      responses:
        '204':
          description: Deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ServerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/swa/trust-domains/{trust-domain-name}/.well-known/openid-configuration:
    get:
      summary: Get OpenID Connect discovery document
      description: >
        Returns the OpenID Connect discovery document for the trust domain in the path.
        This endpoint is public; you do not need to authenticate.
      operationId: get-openid-configuration
      tags:
        - Signing Keys
      # kics-scan ignore-line
      security: []
      parameters:
        - $ref: '#/components/parameters/TrustDomainName'
      responses:
        '200':
          description: OpenID Connect discovery document
          content:
            application/x.secretsmgr.v2+json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
        '400':
          description: Bad request
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Trust domain not found
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/swa/trust-domains/{trust-domain-name}/.well-known/jwks:
    get:
      summary: Get JWKS document
      description: >
        Returns the JSON Web Key Set (JWKS) for the trust domain in the path.
        This endpoint is public; you do not need to authenticate.
      operationId: get-jwks
      tags:
        - Signing Keys
      # kics-scan ignore-line
      security: []
      parameters:
        - $ref: '#/components/parameters/TrustDomainName'
      responses:
        '200':
          description: JWKS document
          content:
            application/x.secretsmgr.v2+json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '400':
          description: Bad request
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Trust domain not found
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/x.secretsmgr.v2+json:
              schema:
                type: object
                properties:
                  error:
                    type: string

tags:
  - name: Trust Domains
    description: >
      Create, retrieve, update, list, and delete SWA trust domains.
  - name: Server Groups
    description: >
      Create, retrieve, update, list, and delete SWA server groups.
  - name: Servers
    description: Register, list, retrieve, and delete SWA servers in a server group.
  - name: Node Groups
    description: >
      Create, retrieve, update, list, and delete SWA node groups.
  - name: Signing Keys
    description: >
      Retrieve OpenID Connect discovery documents, JWKS documents, and CA bundles for SWA federation.

components:
  parameters:
    AcceptSwa:
      name: Accept
      in: header
      description: >
        Include this `Accept` header on SWA management API requests. Use
        `application/x.secretsmgr.v2+json`.
      required: true
      schema:
        type: string
        enum:
          - application/x.secretsmgr.v2+json
    TrustDomainName:
      name: trust-domain-name
      in: path
      description: >
        The trust domain name. This value is case-sensitive, must contain 1-60 characters, and can include letters,
        numbers, periods, underscores, and hyphens only.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
        pattern: '^[a-zA-Z0-9._-]+$'
        example: 'prod.example.com'
    ServerGroupName:
      name: server-group-name
      in: path
      description: >
        The server group name. This value is case-sensitive, must contain 1-60 characters, and can include letters,
        numbers, periods, underscores, and hyphens only.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
        pattern: '^[a-zA-Z0-9._-]+$'
        example: 'production-servers'
    ServerName:
      name: server-name
      in: path
      description: >
        The server name. This value must be 1-60 characters long and can include only letters, numbers, periods,
        underscores, and hyphens.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
        pattern: '^[a-zA-Z0-9._-]+$'
        example: 'production-server-1'
    NodeGroupName:
      name: node-group-name
      in: path
      description: >
        The node group name. This value is case-sensitive, must contain 1-60 characters, and can include letters, numbers,
        periods, underscores, and hyphens only.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 60
        pattern: '^[a-zA-Z0-9._-]+$'
        example: 'production-nodes'
    Limit:
      name: limit
      in: query
      description: The maximum number of items to return (default 100, max 1000).
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
        example: 100
    Offset:
      name: offset
      in: query
      description: The number of items to skip before starting to return results (default 0).
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
        example: 0

  securitySchemes:
    ConjurAccessToken:
      name: Authorization
      type: apiKey
      in: header
      description: 'Set the header to `Token token="<jwt-token>"`.'

  headers:
    Content-Type-V2:
      description: >
        Response body uses the v2 Secrets Manager JSON media type
        `application/x.secretsmgr.v2+json`.
      schema:
        type: string
        enum:
          - application/x.secretsmgr.v2+json

  examples:
    WrongAcceptHeader:
      value:
        code: bad_request
        message: 'This endpoint requires "application/x.secretsmgr.v2+json" accept header'
    ValidationError:
      value:
        code: unprocessable_entity
        message: "The request contains invalid data. Please check the field values and try again."
    TrustDomainAlreadyExists:
      value:
        code: trust_domain_already_exists
        message: "trust domain with name 'example.org' already exists"
    TrustDomainNotFound:
      value:
        code: trust_domain_not_found
        message: "trust domain with name 'example.org' not found"
    NodeGroupNotFound:
      value:
        code: node_group_not_found
        message: "node group with name 'example_node_group' not found"
    NodeGroupAlreadyExists:
      value:
        code: node_group_already_exists
        message: "node group with name 'example_node_group' already exists"
    ServerGroupNotFound:
      value:
        code: server_group_not_found
        message: "server group with name 'example_server_group' not found"
    ServerGroupAlreadyExists:
      value:
        code: server_group_already_exists
        message: "server group with name 'example_server_group' already exists"
    ServerNotFound:
      value:
        code: server_not_found
        message: "server with name 'example-server' not found"
    ServerAlreadyExists:
      value:
        code: server_already_exists
        message: "server with name 'example-server' already exists"
    Unauthorized:
      value:
        code: unauthorized
        message: 'Authentication is required. Please provide a valid access token.'
    Forbidden:
      value:
        code: forbidden
        message: 'You do not have permission to perform this action'
    InternalServerError:
      value:
        code: internal_server_error
        message: 'An unexpected error occurred while processing your request. Please try again later.'

  responses:
    BadRequest:
      description: Invalid input or syntax error.
      headers:
        Content-Type:
